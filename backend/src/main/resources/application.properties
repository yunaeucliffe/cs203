spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:[::1]}:5432/silverroute?connectTimeout=10
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

spring.config.import=optional:file:../.env[.properties]

# Geometric shelter matching is an estimate, measured in metres.
routing.shelter-tolerance-meters=10
