spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
# Vercel's container runtime injects PORT (default 80, overridable in project
# settings); 8081 stays the fallback for local development and other hosts.
server.port=${PORT:8081}
# Behind Vercel's proxy the app must use X-Forwarded-Host/Proto to know the
# public origin; otherwise same-origin POSTs (which carry an Origin header)
# look cross-origin and are rejected with 403 "Invalid CORS request".
server.forward-headers-strategy=framework

# DB_URL overrides everything else with a full JDBC connection string (e.g. a
# managed Postgres provider's connection string). Otherwise the pieces below
# compose the URL; DB_SSLMODE defaults to "disable" to preserve local
# development against an unencrypted PostgreSQL instance and should be set to
# "require" (or stricter) for an external database reached over the network.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:[::1]}:5432/${DB_NAME:silverroute}?connectTimeout=10&sslmode=${DB_SSLMODE:disable}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Shared session storage (see database/migrations/004_spring_session.sql) so
# authentication survives container replacement and works across multiple
# backend instances; schema is managed by our own non-destructive migrations,
# not Spring Session's auto-initializer.
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

csrf.cookie.same-site=${SESSION_COOKIE_SAMESITE:lax}
csrf.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Shared secret an external scheduler must present (as "Authorization: Bearer
# <value>") to invoke the expired-trip-share cleanup endpoint. Leave unset to
# keep that endpoint rejecting every request.
cron.secret=${CRON_SECRET:}

spring.config.import=optional:file:../.env[.properties]

# Geometric shelter matching is an estimate, measured in metres.
routing.shelter-tolerance-meters=10

# Reject fractional JSON values for integer preferences instead of silently truncating them.
spring.jackson.deserialization.accept-float-as-int=false

# App comfort threshold, not a medical heat-risk threshold.
routing.weather.heat-threshold-celsius=${WEATHER_HEAT_THRESHOLD_CELSIUS:33}
