spring.application.name=backend
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:[::1]}:5432/silverroute?connectTimeout=10
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Origins allowed to call the API with credentials, comma separated. A frontend that reaches
# the API through a same-origin proxy needs nothing here. One served from its own origin must
# be listed, and also needs SESSION_COOKIE_SAME_SITE=none with SESSION_COOKIE_SECURE=true so
# the browser sends its session cookie cross-site.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.config.import=optional:file:../.env[.properties]

# Geometric shelter matching is an estimate, measured in metres.
routing.shelter-tolerance-meters=10
