<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SilverRoute Demo</title>
    <style>
      :root {
        --bg: #f3f7fb;
        --panel: #ffffff;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --text: #0f172a;
        --muted: #475569;
        --success: #16a34a;
        --border: #dbe3ee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .card {
        width: min(540px, 90vw);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      h1 {
        margin-top: 0;
        font-size: 2rem;
      }

      p {
        color: var(--muted);
        line-height: 1.6;
      }

      .status {
        margin: 20px 0;
        padding: 16px 18px;
        border-radius: 10px;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        font-weight: 600;
      }

      .status.success {
        background: #ecfdf5;
        border-color: #bbf7d0;
        color: var(--success);
      }

      .controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      button {
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        padding: 12px 18px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--accent-dark);
      }

      pre {
        margin-top: 18px;
        background: #0f172a;
        color: #e2e8f0;
        padding: 16px;
        border-radius: 10px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>SilverRoute</h1>
      <p>Basic frontend page connected to the Spring Boot backend.</p>

      <div id="status" class="status">Checking backend connection...</div>

      <div class="controls">
        <button id="checkBtn">Check backend</button>
      </div>

      <pre id="responseBox">Waiting for response...</pre>
    </div>

    <script>
      const statusEl = document.getElementById('status');
      const responseBox = document.getElementById('responseBox');
      const checkBtn = document.getElementById('checkBtn');

      async function checkBackend() {
        statusEl.textContent = 'Connecting...';
        statusEl.className = 'status';

        try {
          const response = await fetch('http://localhost:8081/api/health');
          const data = await response.json();

          responseBox.textContent = JSON.stringify(data, null, 2);

          if (response.ok) {
            statusEl.textContent = 'Backend connected successfully';
            statusEl.classList.add('success');
          } else {
            statusEl.textContent = 'Backend responded with an error';
          }
        } catch (error) {
          statusEl.textContent = 'Connection failed. Start the backend on port 8081.';
          responseBox.textContent = 'Error: ' + error.message;
        }
      }

      checkBtn.addEventListener('click', checkBackend);
      checkBackend();
    </script>
  </body>
</html>
